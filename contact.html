<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Bacolod Coffee Spots</title>
  <!-- Link to central stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Bacolod Coffee Spots</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <h2 style="color: #ffffff; margin-bottom: 20px;">Get in Touch</h2>

      <div class="form-group">
        <label for="contact-name">Your Name</label>
        <input type="text" id="contact-name" name="name" placeholder="Vincent Verso" required>
      </div>

      <div class="form-group">
        <label for="contact-email">Your Email Address</label>
        <input type="email" id="contact-email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Vincent Rev D. Verso. All rights reserved.</p>
  </footer>

</body>
</html>
