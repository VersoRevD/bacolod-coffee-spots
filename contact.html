<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Bacolod Coffee Spots</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Flexbox Header -->
  <header class="site-header">
    <h1>Bacolod Coffee Spots</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Get in Touch</h2>
    <form action="#" method="post">
      <fieldset>
        <legend>Send Us a Message</legend>

        <label for="sender-name">Your Name</label>
        <input type="text" id="sender-name" name="name" required placeholder="Your full name">

        <label for="sender-email">Email Address</label>
        <input type="email" id="sender-email" name="email" required placeholder="name@example.com">

        <label for="message">Message / Recommendation</label>
        <textarea id="message" name="message" rows="5" required placeholder="Tell us about a coffee shop we missed..."></textarea>

        <button type="submit">Send Message</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Vincent Rev D. Verso | Bacolod Coffee Spots</p>
  </footer>

</body>
</html>
