    <article class="place-card">

    <form action="#" method="post">
      <fieldset>
        <legend>Suggest Improvements</legend>

        <label for="visitor-name">Your Name</label>

        <label for="visitor-email">Your Email</label>
        <input type="email" id="visitor-email" name="email" required>

        <label for="suggestions">Feedback</label>
        <textarea id="suggestions" name="suggestions" rows="4" required></textarea>

        <button type="submit">Submit Feedback</button>
      </fieldset>
    </form>
